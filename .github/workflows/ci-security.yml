name: CI Security & Quality Gate

on:
  push:
    branches: [main, security/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit-and-test:
    name: Audit & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit (Production)
        run: npm audit --omit=dev

      - name: Run Security Test Suite
        run: npm test
